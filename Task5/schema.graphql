# Типы данных
type Client {
  id: ID!
  name: String!
  age: Int
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int
}

# Запросы
type Query {
  client(id: ID!): Client
  clients: [Client!]!
  document(id: ID!): Document
  relative(id: ID!): Relative
}

# Основная схема
schema {
  query: Query
}