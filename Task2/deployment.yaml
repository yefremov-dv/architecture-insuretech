apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-app
  template:
    metadata:
      labels:
        app: insuretech-app
    spec:
      containers:
      - name: insuretech-app-container
        image: shestera/scaletestapp:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "30Mi"